name: DARK IPA Build

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build iOS App
runs-on: macos-latest

steps:
  - name: Download Repository
    uses: actions/checkout@v4
  - name: Check Xcode
    run: xcodebuild -version
  - name: Find Xcode Project
    run: |
      find . -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \)
  - name: Build Application
    run: |
      xcodebuild \
        -project ThreeOneOSFive.xcodeproj \
        -scheme ThreeOneOSFive \
        -configuration Release \
        -sdk iphoneos \
        -derivedDataPath build \
        CODE_SIGNING_ALLOWED=NO
  - name: Upload Build
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: DARK-build
      path: build/Build/Products/Release-iphoneos/
      if-no-files-found: error
